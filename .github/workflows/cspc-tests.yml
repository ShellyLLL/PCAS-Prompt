name: CSPC unit tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  cspc-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==1.13.1+cpu torchvision==0.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install yacs==0.1.8 tqdm==4.66.1 ftfy==6.1.1 regex==2023.10.3 scikit-learn==1.3.2 pytest

      - name: Run CSPC unit tests
        run: python -m pytest -q tests
