name: VSMR architecture tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  vsmr-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.2 torchvision==0.17.2
          python -m pip install timm==0.6.12 numpy==1.26.4 pillow tqdm
      - name: Compile VSMR implementation
        run: |
          python -m py_compile train.py models/base/vsmr_modules.py models/base/vsmr_losses.py models/base/vsmr_resynthesis.py models/base/vsmr_trainer.py
      - name: Run VSMR tests
        run: python -m unittest discover -s tests -p 'test_vsmr.py' -v
