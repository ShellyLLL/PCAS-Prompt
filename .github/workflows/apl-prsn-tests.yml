name: APL-PRSN unit tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.2 torchvision==0.17.2
          python -m pip install timm==0.6.12 numpy==1.26.4 pillow tqdm
      - name: Compile active implementation
        run: |
          python -m py_compile train.py models/base/apl_prsn_modules.py models/base/apl_prsn_losses.py models/base/apl_prsn_trainer.py
      - name: Run APL-PRSN tests
        run: python -m unittest discover -s tests -p 'test_apl_prsn.py' -v
